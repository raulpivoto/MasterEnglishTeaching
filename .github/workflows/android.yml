name: Android app

on:
  push:
    branches: [claude/english-c2-teaching-plan-xwaqp4]
    paths:
      - index.html
      - icons/**
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle the site into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r icons android/app/src/main/assets/

      - name: Build APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LanguageLensStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LanguageLensStudio-apk
          path: LanguageLensStudio.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Language Lens Studio (Android) 1.0.${{ github.run_number }}
          body: |
            App Android do Language Lens Studio.
            No celular, baixe **LanguageLensStudio.apk** abaixo e toque no arquivo para instalar.
            Link fixo para a versão mais recente:
            https://github.com/${{ github.repository }}/releases/latest/download/LanguageLensStudio.apk
          files: LanguageLensStudio.apk
          make_latest: true
