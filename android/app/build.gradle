plugins {
    id 'com.android.application'
}

// CI passes -PversionCode=<run number> so every build installs over the previous one.
def buildNumber = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'com.raulpivoto.lensstudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.raulpivoto.lensstudio'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // A fixed key, kept in the repo, so updates install over the old app
        // (and keep your progress) instead of requiring an uninstall.
        release {
            storeFile file('lensstudio.keystore')
            storePassword 'lensstudio'
            keyAlias 'lensstudio'
            keyPassword 'lensstudio'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
